{% extends "layouts/auth.html" %}
{% block title %}Reset password · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="t-h1 text-[24px]">Reset your password</h1>
<p class="mt-1.5 text-[14px] text-graphite">We will email you a secure link to choose a new one.</p>

<div id="auth-msg" class="mt-5 empty:mt-0"></div>

<form hx-post="/auth/password-reset" hx-target="#auth-msg" hx-swap="innerHTML"
      hx-disabled-elt="find button" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="block">
    <span class="mb-1.5 block text-[13px] font-medium text-ink-black">Email</span>
    <input class="input w-full" type="email" name="email" autocomplete="email" placeholder="you@studio.com" required>
  </label>
  <button class="btn btn-primary w-full" type="submit">Send reset link</button>
</form>

<p class="mt-6 text-[13.5px] text-graphite"><a href="/login" class="link">Back to log in</a></p>
{% endblock %}
