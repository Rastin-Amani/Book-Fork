{% extends "layouts/auth.html" %}
{% block title %}Verify email · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="t-h1 text-[24px]">Verify your email</h1>
<p class="mt-1.5 text-[14px] text-graphite">One click and your workspace is ready.</p>

<div id="auth-msg" class="mt-5 empty:mt-0"></div>

{% if token %}
<form hx-post="/auth/verify-email/confirm" hx-target="#auth-msg" hx-swap="innerHTML"
      hx-disabled-elt="find button" class="mt-6">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="token" value="{{ token }}">
  <button class="btn btn-primary w-full" type="submit">Confirm verification</button>
</form>
{% else %}
<form hx-post="/auth/verify-email" hx-target="#auth-msg" hx-swap="innerHTML"
      hx-disabled-elt="find button" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="block">
    <span class="mb-1.5 block text-[13px] font-medium text-ink-black">Email</span>
    <input class="input w-full" type="email" name="email" autocomplete="email" placeholder="you@studio.com" required>
  </label>
  <button class="btn btn-primary w-full" type="submit">Send verification link</button>
</form>
{% endif %}
{% endblock %}
