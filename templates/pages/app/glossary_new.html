{% extends "layouts/base.html" %}
{% block title %}New glossary · {{ app_name }}{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl space-y-6">
  <div class="breadcrumbs min-w-0 max-w-full overflow-x-auto text-[12px] text-base-content/45">
    <ul>
      <li><a href="/app/glossaries">Glossaries</a></li>
      <li class="text-base-content/70">New</li>
    </ul>
  </div>
  <header class="space-y-2">
    <p class="font-mono text-[10.5px] uppercase tracking-[0.16em] text-base-content/45">New</p>
    <h1 class="text-[28px] font-semibold leading-tight tracking-[-0.03em]">Create a glossary</h1>
  </header>

  <form hx-post="/app/glossaries" class="card card-border bg-base-100">
    <div class="card-body gap-5 p-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="block">
        <span class="mb-1.5 block text-[13px] font-medium">Name</span>
        <input class="input w-full" name="name" placeholder="Product terminology" required>
      </label>
      <label class="block">
        <span class="mb-1.5 block text-[13px] font-medium">Description <span class="font-normal text-base-content/40">(optional)</span></span>
        <textarea class="textarea w-full" name="description" rows="3" placeholder="What this glossary is for"></textarea>
      </label>
      <div class="flex items-center gap-2 pt-1">
        <button class="btn btn-primary" type="submit">Create glossary</button>
        <a class="btn btn-ghost" href="/app/glossaries">Cancel</a>
      </div>
    </div>
  </form>
</section>
{% endblock %}
