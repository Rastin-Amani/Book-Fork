{% extends "layouts/auth.html" %}
{% block title %}Set new password · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="t-h1 text-[24px]">Set a new password</h1>
<p class="mt-1.5 text-[14px] text-graphite">Choose something long and memorable.</p>

<div id="auth-msg" class="mt-5 empty:mt-0"></div>

{% if token %}
<form hx-post="/auth/password-reset/confirm" hx-target="#auth-msg" hx-swap="innerHTML"
      hx-disabled-elt="find button" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="token" value="{{ token }}">
  <label class="block">
    <span class="mb-1.5 block text-[13px] font-medium text-ink-black">New password</span>
    <input class="input w-full" type="password" name="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
  </label>
  <label class="block">
    <span class="mb-1.5 block text-[13px] font-medium text-ink-black">Confirm password</span>
    <input class="input w-full" type="password" name="password_confirm" autocomplete="new-password" minlength="8" placeholder="Repeat your password" required>
  </label>
  <button class="btn btn-primary w-full" type="submit">Update password</button>
</form>
{% else %}
<div class="mt-6 t-card border-error/30 bg-error/5 p-4 text-[13.5px] text-error" role="alert">Missing reset token. Request a new link.</div>
<p class="mt-6 text-[13.5px] text-graphite"><a href="/forgot-password" class="link">Request a new link</a></p>
{% endif %}
{% endblock %}
