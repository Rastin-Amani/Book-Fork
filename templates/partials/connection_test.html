{% if result.ok %}
<span class="inline-flex items-center gap-1.5 text-[12.5px] text-success"><span class="size-1.5 rounded-full bg-success"></span>{{ result.status.value }}</span>
{% else %}
<span class="inline-flex items-center gap-1.5 text-[12.5px] text-error"><span class="size-1.5 rounded-full bg-error"></span>{{ result.status.value }}</span>
{% endif %}
<span class="ms-1 text-[12px] text-base-content/45">{{ result.message }}</span>
