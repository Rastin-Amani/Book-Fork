{% from "components/icons.html" import icon %}
<div id="segment-{{ segment.id }}" class="card card-border grid gap-0 overflow-hidden bg-base-100 sm:grid-cols-2">
  <div class="border-b border-base-300 bg-base-200/40 p-5 sm:border-b-0 sm:border-e">
    <p class="mb-2.5 font-mono text-[10px] uppercase tracking-[0.14em] text-base-content/45">Original</p>
    <p class="whitespace-pre-wrap text-[14px] leading-relaxed text-base-content/70">{{ segment.source_text }}</p>
  </div>
  <form class="space-y-3 p-5" hx-post="/app/translations/{{ job.id }}/segments/{{ segment.id }}"
        hx-target="#segment-{{ segment.id }}" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p class="font-mono text-[10px] uppercase tracking-[0.14em] text-base-content/45">Translation</p>
    <textarea class="textarea w-full text-[14px] leading-relaxed" name="translated_text" rows="3">{{ segment.translated_text or '' }}</textarea>
    <div class="flex flex-wrap items-center gap-3">
      <button class="btn btn-sm" type="submit">Save</button>
      <label class="flex items-center gap-2 text-[13px] text-base-content/65">
        <input type="checkbox" class="checkbox checkbox-sm" name="approve" value="1" {% if segment.status == 'validated' %}checked{% endif %}> Approved
      </label>
      {% if segment.status == 'validated' %}
      <span class="inline-flex items-center gap-1 text-[12px] font-semibold text-success">{{ icon('check', 'size-3.5') }} validated</span>
      {% else %}
      <span class="font-mono text-[10.5px] uppercase tracking-[0.1em] text-base-content/40">{{ segment.status }}</span>
      {% endif %}
    </div>
  </form>
</div>
