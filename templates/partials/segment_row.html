{% from "components/icons.html" import icon %}
<div id="segment-{{ segment.id }}" class="t-card grid gap-0 overflow-hidden sm:grid-cols-2">
  <div class="border-b border-stone-gray p-5 sm:border-b-0 sm:border-r">
    <p class="eyebrow mb-2.5">Original</p>
    <p class="whitespace-pre-wrap text-[14px] leading-relaxed text-graphite">{{ segment.source_text }}</p>
  </div>
  <form class="space-y-3 p-5" hx-post="/app/translations/{{ job.id }}/segments/{{ segment.id }}"
        hx-target="#segment-{{ segment.id }}" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p class="eyebrow">Translation</p>
    <textarea class="textarea w-full text-[14px] leading-relaxed" name="translated_text" rows="3">{{ segment.translated_text or '' }}</textarea>
    <div class="flex flex-wrap items-center gap-3">
      <button class="btn btn-sm" type="submit">Save</button>
      <label class="flex items-center gap-2 text-[13px] text-graphite">
        <input type="checkbox" class="checkbox checkbox-sm" name="approve" value="1" {% if segment.status == 'validated' %}checked{% endif %}> Approved
      </label>
      {% if segment.status == 'validated' %}
      <span class="inline-flex items-center gap-1 text-[12px] font-semibold text-success">{{ icon('check', 'h-3.5 w-3.5') }} validated</span>
      {% else %}
      <span class="text-[12px] uppercase tracking-[0.05em] text-mid-gray">{{ segment.status }}</span>
      {% endif %}
    </div>
  </form>
</div>
