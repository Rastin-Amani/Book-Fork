{% macro brand(href='/', dark=false, size='md') %}
<a href="{{ href }}" class="group inline-flex items-center gap-2.5" aria-label="Book Fork — home">
  <span class="grid place-items-center rounded-field {{ 'bg-base-100 text-base-content' if dark else 'bg-neutral text-primary' }} {{ 'size-7' if size == 'sm' else 'size-8' }} transition-transform duration-200 group-hover:-rotate-3">
    <svg viewBox="3 3 26 26" class="{{ 'size-3.5' if size == 'sm' else 'size-4' }}" fill="currentColor" aria-hidden="true">
      <path d="M5,4 H10 V15.25 A1.75,1.75 0 0 0 13.5,15.25 V4 H18.5 V15.25 A1.75,1.75 0 0 0 22,15.25 V4 H27 V26 Q27,28 25,28 H7 Q5,28 5,26 Z"/>
    </svg>
  </span>
  <span class="font-semibold tracking-[-0.02em] {{ 'text-[15px]' if size == 'sm' else 'text-[17px]' }} {{ 'text-base-100' if dark else 'text-base-content' }}">Book Fork</span>
</a>
{% endmacro %}
