{#
  Minimal stroke icon set (24x24, currentColor, 1.6 weight) so the interface
  stays crisp and flat without an icon-font dependency.
#}
{% macro icon(name, klass='h-4 w-4') %}
<svg class="{{ klass }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'grid' -%}
<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'translate' -%}
<path d="M4 5h8M8 3v2c0 4-2 6-5 7"/><path d="M6 9c1 3 3 5 6 6"/><path d="M13 21l4-9 4 9M14.5 17h5"/>
{%- elif name == 'file' -%}
<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>
{%- elif name == 'book' -%}
<path d="M4 5a2 2 0 0 1 2-2h11v16H6a2 2 0 0 0-2 2z"/><path d="M6 19h11"/><path d="M8 7h6"/>
{%- elif name == 'database' -%}
<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
{%- elif name == 'plug' -%}
<path d="M9 3v5M15 3v5"/><path d="M7 8h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5z"/><path d="M12 16v5"/>
{%- elif name == 'settings' -%}
<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1A2 2 0 1 1 4.2 17l.1-.1A1.7 1.7 0 0 0 3.1 14a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1A2 2 0 1 1 7 4.2l.1.1A1.7 1.7 0 0 0 10 3.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0 1.2 2.9 2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.5 1z"/>
{%- elif name == 'plus' -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == 'arrow-right' -%}
<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'arrow-left' -%}
<path d="M19 12H5M11 18l-6-6 6-6"/>
{%- elif name == 'arrow-up-right' -%}
<path d="M7 17 17 7M8 7h9v9"/>
{%- elif name == 'check' -%}
<path d="M20 6 9 17l-5-5"/>
{%- elif name == 'x' -%}
<path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == 'alert' -%}
<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
{%- elif name == 'info' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
{%- elif name == 'upload' -%}
<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/>
{%- elif name == 'download' -%}
<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>
{%- elif name == 'play' -%}
<path d="M6 4l14 8-14 8z"/>
{%- elif name == 'user' -%}
<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == 'logout' -%}
<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>
{%- elif name == 'chevron-down' -%}
<path d="m6 9 6 6 6-6"/>
{%- elif name == 'chevron-right' -%}
<path d="m9 6 6 6-6 6"/>
{%- elif name == 'menu' -%}
<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'sparkles' -%}
<path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/>
{%- elif name == 'shield' -%}
<path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/><path d="m9 12 2 2 4-4"/>
{%- elif name == 'globe' -%}
<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>
{%- elif name == 'credit-card' -%}
<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>
{%- elif name == 'trash' -%}
<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
{%- elif name == 'refresh' -%}
<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
{%- elif name == 'list' -%}
<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
{%- elif name == 'activity' -%}
<path d="M3 12h4l3 8 4-16 3 8h4"/>
{%- elif name == 'wrench' -%}
<path d="M15 7a4 4 0 0 1 5 5l-9 9-5-5 9-9z"/><path d="m6 16-3 3 2 2 3-3"/>
{%- else -%}
<circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
{% endmacro %}
