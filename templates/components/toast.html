<div id="toast-root"
     x-data="{
       toast: null,
       show(event) { this.toast = event.detail; clearTimeout(this._t); this._t = setTimeout(() => this.toast = null, 4200); }
     }"
     @show-toast.window="show($event)"
     class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] flex flex-col items-center gap-2 px-4 sm:items-end sm:pe-6"
     aria-live="polite">
  <template x-if="toast">
    <div class="pointer-events-auto flex w-full max-w-[380px] items-start gap-3 rounded-box border border-base-300 bg-base-100 px-4 py-3 shadow-lg">
      <span class="mt-[3px] size-2 shrink-0 rounded-full"
            :class="toast.type === 'error' ? 'bg-warning' : 'bg-info'"></span>
      <p class="text-[13.5px] leading-snug" x-text="toast.message"></p>
      <button type="button" @click="toast = null" class="-me-1 -mt-0.5 ms-auto rounded p-1 text-base-content/40 hover:text-base-content" aria-label="Dismiss">
        <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </template>
</div>
