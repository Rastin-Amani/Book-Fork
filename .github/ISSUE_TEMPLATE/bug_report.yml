name: Bug report
description: Something is broken or behaves differently from the docs.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste API keys, provider credentials, or unpublished
        document content. Report security issues privately via SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error, status badge, or log line if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload ...
        2. Choose ...
        3. Start ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.6.1
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Local (make web / make worker)
        - Managed app
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, tokens, and document content.
      render: shell
    validations:
      required: false
